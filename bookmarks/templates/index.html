<!DOCTYPE html>
<html>
<head>
    <title>Smart Bookmark Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #dce6f2);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.8s ease-in-out;
        }

        h2 {
            font-weight: 700;
            color: #1f3c88;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #d1d9e6;
        }

        .btn-primary {
            background-color: #1f3c88;
            border: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: #163172;
            transform: scale(1.05);
        }

        .list-group-item {
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #e3eaf3;
            transition: 0.3s;
        }

        .list-group-item:hover {
            transform: translateY(-4px);
            box-shadow: 0px 8px 18px rgba(0,0,0,0.06);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow p-5">
        <h2 class="text-center mb-4">Smart Bookmark Manager 🔖</h2>

        <div class="row g-2 mb-4">
            <div class="col-md-5">
                <input id="title" class="form-control" placeholder="Enter Title">
            </div>
            <div class="col-md-5">
                <input id="url" class="form-control" placeholder="Enter URL">
            </div>
            <div class="col-md-2 d-grid">
                <button id="mainButton" class="btn btn-primary" onclick="addBookmark()">Add</button>
            </div>
        </div>

        <h4 class="mb-3">Saved Bookmarks</h4>
        <ul id="bookmarkList" class="list-group"></ul>
    </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage">
        Action successful!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script>

let editingId = null;

function showToast(message) {
    const toastMessage = document.getElementById("toastMessage");
    toastMessage.textContent = message;

    const toast = new bootstrap.Toast(document.getElementById("liveToast"));
    toast.show();
}

async function loadBookmarks() {
    const response = await fetch('/api/bookmarks/');
    const data = await response.json();

    const list = document.getElementById('bookmarkList');
    list.innerHTML = '';

    if (data.length === 0) {
        list.innerHTML = `<li class="list-group-item text-center text-muted">No bookmarks added yet.</li>`;
        return;
    }

    data.forEach(bookmark => {
        list.innerHTML += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>${bookmark.title}</strong><br>
                    <a href="${bookmark.url}" target="_blank" class="text-decoration-none text-primary">
                        ${bookmark.url}
                    </a>
                </div>
                <div>
                    <button class="btn btn-warning btn-sm me-2"
                        onclick="prepareEdit(${bookmark.id}, '${bookmark.title}', '${bookmark.url}')">
                        Edit
                    </button>
                    <button class="btn btn-danger btn-sm"
                        onclick="deleteBookmark(${bookmark.id})">
                        Delete
                    </button>
                </div>
            </li>
        `;
    });
}

function prepareEdit(id, title, url) {
    editingId = id;
    document.getElementById('title').value = title;
    document.getElementById('url').value = url;
    document.getElementById('mainButton').textContent = "Update";
}

async function addBookmark() {
    const title = document.getElementById('title').value.trim();
    const url = document.getElementById('url').value.trim();

    if (!title || !url) {
        showToast("Please enter both Title and URL");
        return;
    }

    if (editingId === null) {
        await fetch('/api/bookmarks/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, url })
        });
        showToast("Bookmark Added Successfully!");
    } else {
        await fetch(`/api/bookmarks/${editingId}/`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, url })
        });
        showToast("Bookmark Updated Successfully!");
        editingId = null;
        document.getElementById('mainButton').textContent = "Add";
    }

    document.getElementById('title').value = '';
    document.getElementById('url').value = '';

    loadBookmarks();
}

async function deleteBookmark(id) {
    await fetch(`/api/bookmarks/${id}/`, { method: 'DELETE' });
    showToast("Bookmark Deleted!");
    loadBookmarks();
}

loadBookmarks();

</script>

</body>
</html>
